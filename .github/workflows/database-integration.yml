name: Database integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Verify concurrent inserts cannot double-book
        run: bash scripts/test-concurrent-booking.sh
