[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/create-reservation"
  to = "/.netlify/functions/create-reservation"
  status = 200

[[redirects]]
  from = "/api/availability"
  to = "/.netlify/functions/availability"
  status = 200

[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200

[[redirects]]
  from = "/api/telegram/auth"
  to = "/.netlify/functions/telegram-auth"
  status = 200

[[redirects]]
  from = "/api/telegram/profile"
  to = "/.netlify/functions/telegram-profile"
  status = 200

[[redirects]]
  from = "/api/telegram/booking"
  to = "/.netlify/functions/telegram-booking"
  status = 200

[[redirects]]
  from = "/api/telegram/webhook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200

[[redirects]]
  from = "/api/reservation-media"
  to = "/.netlify/functions/reservation-media"
  status = 200

[[redirects]]
  from = "/api/create-booking"
  to = "/.netlify/functions/create-booking"
  status = 200

[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/bookings"
  status = 200

[[redirects]]
  from = "/api/booking-status"
  to = "/.netlify/functions/booking-status"
  status = 200

[[redirects]]
  from = "/api/booking-cancel"
  to = "/.netlify/functions/booking-cancel"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://tuqyyocmykuryoycysmn.supabase.co https://challenges.cloudflare.com; font-src 'self' data:; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org; frame-src https://challenges.cloudflare.com; img-src 'self' data: blob: https:; object-src 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://telegram.org; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
